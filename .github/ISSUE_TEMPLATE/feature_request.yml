name: "✨ Feature request"
description: Propose a scoped improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Console interaction
        - Player records
        - Tournament records
        - Security
        - Documentation
        - Testing
        - Other
    validations:
      required: true
