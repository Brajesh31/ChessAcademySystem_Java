<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">Current application architecture</title><desc id="d">Console user interacts with a single Java process that reads in-source credentials and local player and tournament text files.</desc>
